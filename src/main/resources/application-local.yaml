server:
  port: 8080

spring:
  application:
    name: rcszh-tax
  # The application builds DeepSeek's OpenAI-compatible clients explicitly in
  # DeepSeekAi, RouteAiFallbackService and DividendAiEnhanceService. Disable
  # Spring AI's generic OpenAI clients so startup does not require a separate
  # spring.ai.openai.api-key (or create an unused OpenAI bean).
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:8.134.152.53}:${DB_PORT:3306}/${DB_NAME:rcszh_tax}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Tj%&2*hq^aAvUrc!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid

logging:
  level:
    com.rcszh.tax: INFO

app:
  storage:
    base-dir: ${APP_STORAGE_DIR:./data}
    public-base-url: ${APP_PUBLIC_BASE_URL:}
  ai:
    deepseek-api-key: sk-9463061a14864d99854fc8f5698e539b
    deepseek-base-url: https://api.deepseek.com
    deepseek-model: deepseek-chat
  mineru:
    token: sk-nFQwtCAZkyeS99jTWY4cepM9ddGtNxjm7aKI8mZZuxgn4Qe1
    create-task-url: https://mineru.net/api/v4/extract/task
    task-result-url: https://mineru.net/api/v4/extract/task/
    ocr: false
